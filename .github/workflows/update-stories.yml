name: Update stories

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect the latest headlines
        run: node scripts/fetch-stories.mjs
      - name: Save stories.json if it changed
        run: |
          git config user.name "9jatunes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stories.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update stories"
            git push
          fi
